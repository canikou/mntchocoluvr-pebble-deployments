# PebbleHost calls root bot.py. This file controls which registered bots it starts.
# Toggle a bot with enabled = true or enabled = false.

[bot:youtool1]
enabled = false
name = youtool1
path = Bots/youtool1-highgrounds
module = yt_assist
stop_file = data/youtool1.stop

[bot:mech1]
enabled = false
name = mech1
path = Bots/mech1-highgrounds
